<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
<title id="title">Connected systems</title>
<desc id="desc">A gently animated network representing interaction and feedback between autonomous systems.</desc>
<style>
.edge{fill:none;stroke:#aac6bd;stroke-width:2}
.flow{fill:none;stroke:#398673;stroke-width:2;stroke-dasharray:5 23;animation:flow 12s linear infinite}
.node{fill:#f4f8f5;stroke:#398673;stroke-width:2}
.halo{fill:#81b5a4;opacity:.18;transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-112}}
@keyframes breathe{50%{transform:scale(1.22);opacity:.08}}
@media(prefers-reduced-motion:reduce){.flow,.halo{animation:none}}
</style>
<rect width="900" height="180" rx="12" fill="#f1f6f3"/>
<g class="edge">
<path d="M65 100L185 45L300 115L450 60L590 120L720 45L835 95"/>
<path d="M65 100L185 145L300 115L450 145L590 120L720 145L835 95"/>
<path d="M185 45L185 145M450 60L450 145M720 45L720 145M185 45L450 60L720 45"/>
</g>
<path class="flow" d="M65 100L185 45L300 115L450 60L590 120L720 45L835 95"/>
<path class="flow" d="M835 95L720 145L590 120L450 145L300 115L185 145L65 100"/>
<g class="halo"><circle cx="450" cy="60" r="24"/></g>
<g class="node">
<circle cx="65" cy="100" r="7"/><circle cx="185" cy="45" r="9"/>
<circle cx="185" cy="145" r="6"/><circle cx="300" cy="115" r="10"/>
<circle cx="450" cy="60" r="12"/><circle cx="450" cy="145" r="7"/>
<circle cx="590" cy="120" r="10"/><circle cx="720" cy="45" r="9"/>
<circle cx="720" cy="145" r="6"/><circle cx="835" cy="95" r="7"/>
</g>
</svg>
